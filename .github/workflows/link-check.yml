---
# 12.4：出典（sources[].url）のリンク切れを確かめる（T5-03）。四半期に1回、手動で実行する（13）。
# Actions の画面の「Run workflow」か、gh workflow run link-check.yml -f prefectures=26,kyoto で実行する。
# 結果は Markdown のレポートで、実行の概要（Summary）と Artifact（link-check-report、90日）に残る。
# リンク切れがあれば実行は失敗（赤）になる。要確認（403・5xx・タイムアウト・リダイレクトなど）だけなら成功のまま。
# Issue は自動で作らない（レポートを見て人が作る）。
#
# 安全のために：GitHub が用意するランナー（ubuntu-latest）だけで動かす。セルフホストのランナーは使わない
# （出典のサーバーが https から内部のアドレスへリダイレクトしても、辿った先に社内の資源がないようにする）。
# Secrets は使わず、permissions は contents: read だけにする。
name: link-check

"on":
  workflow_dispatch:
    inputs:
      prefectures:
        description: 対象の県（県コードか id をカンマ・空白で区切る。例：26,kyoto。空なら全県）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # 同じ相手のサーバーに、同時に2つの実行から送らない
  group: link-check
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 入力は env を通してシェルに渡す（${{ }} をスクリプトに直接書かない。コマンドの注入を避ける）
      PREFECTURES: ${{ inputs.prefectures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 終了コード 1（リンク切れ）でも、レポートは概要と Artifact に残す。結果は最後の段階で判定する
      - name: Check links
        id: check
        run: |
          set +e
          pnpm content:links --pref "${PREFECTURES}" --out "${RUNNER_TEMP}/link-check.md"
          code=$?
          echo "exit-code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Write summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/link-check.md" ]; then
            cat "${RUNNER_TEMP}/link-check.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "レポートができませんでした。ログを確かめてください。" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: link-check-report
          path: ${{ runner.temp }}/link-check.md
          if-no-files-found: warn
          retention-days: 90
      # 1：リンク切れあり、2：引数・コンテンツの誤り。どちらも実行を失敗にする
      - name: Fail if broken links or errors
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit-code }}
        run: |
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "終了コード ${EXIT_CODE}（1：リンク切れあり、2：引数・コンテンツの誤り）。レポートを見てください。" >&2
            exit 1
          fi
