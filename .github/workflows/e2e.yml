---
# 12.1：E2E（Playwright）を手動で実行する（T0-04）。
# 開発中は、Actions の分数（private・Free は月2,000分）を抑えるため、PR ごとには実行しない。
# 本番リリース後の扱いは別に決める（U15）。Actions の画面の「Run workflow」か、
# gh workflow run e2e.yml --ref <ブランチ> -f project=<プロジェクト> で実行する
name: e2e

"on":
  workflow_dispatch:
    inputs:
      project:
        description: 動かす Playwright のプロジェクト（all は7つすべて）
        type: choice
        default: all
        # playwright.config.ts の projects と合わせる
        options: [all, chromium, firefox, webkit, iphone, pixel, ipad-portrait, ipad-landscape]

permissions:
  contents: read

concurrency:
  # プロジェクトが違う実行は取り消さない
  group: e2e-${{ github.ref }}-${{ inputs.project }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 選んだプロジェクトが使うブラウザだけを入れる。
      # WebKit・Firefox はシステムのライブラリがないと起動しないので --with-deps を付ける（T0-02）
      - name: Install Playwright browsers
        run: |
          case "${PROJECT}" in
            all) browsers="chromium firefox webkit" ;;
            chromium | pixel) browsers="chromium" ;;
            firefox) browsers="firefox" ;;
            *) browsers="webkit" ;;
          esac
          read -ra browser_list <<< "${browsers}"
          pnpm exec playwright install --with-deps "${browser_list[@]}"
      # サーバーは playwright.config.ts の webServer（pnpm build → wrangler dev）
      - name: E2E test
        id: e2e
        run: |
          if [ "${PROJECT}" = "all" ]; then
            pnpm test:e2e
          else
            pnpm test:e2e --project="${PROJECT}"
          fi
      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          # サーバーの起動の失敗などで HTML レポートがないときも、trace（test-results/）を残す
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
