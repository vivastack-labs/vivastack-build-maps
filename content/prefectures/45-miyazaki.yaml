        kids: "{谷|たに}の{中|なか}に{真名井|まない}の{滝|たき}が{流|なが}れているよ。"
        adult: "{真名井|まない}の{滝|たき}がある{峡谷|きょうこく}です。{阿蘇山|あそさん}の{火砕流|かさいりゅう}が{冷|ひ}えて{固|かた}まり、{侵食|しんしょく}されてできました。"
